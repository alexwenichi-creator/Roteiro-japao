<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roteiro Japão Minimalista</title>
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('App pronto para uso offline'));
  }
</script>
    <style>
        /* Paleta: Preto (#000), Branco (#FFF), Vermelho (#E60012) */
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0; padding: 40px;
            background: linear-gradient(to bottom, #FFF 40%, #EEE 100%);
            /* Fuji Minimalista Estilizado */
            background-image: radial-gradient(circle at 50% 100%, #F5F5F5 30%, transparent 60%);
            color: #000;
        }
        h2 { text-align: center; color: #E60012; text-transform: uppercase; letter-spacing: 2px; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; max-width: 900px; margin: 40px auto; }
        .day { 
            padding: 20px; background: #FFF; border: 2px solid #000; 
            text-align: center; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .day:hover { background: #E60012; color: #FFF; border-color: #E60012; }
        #details { 
            max-width: 900px; margin: 20px auto; padding: 30px; 
            background: #FFF; border: 2px solid #000; display: none; 
        }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { 
            padding: 10px 20px; cursor: pointer; border: 2px solid #000; 
            background: #FFF; font-weight: bold; text-transform: uppercase; 
        }
        button:hover { background: #000; color: #FFF; }
        .content-box { border-left: 5px solid #E60012; padding-left: 20px; line-height: 1.6; }
        a { color: #E60012; text-decoration: none; border-bottom: 1px solid #E60012; }
        .cost-tag { color: #E60012; font-weight: bold; }
    </style>
</head>
<body>

<h2>Japão 2026/2027</h2>
<div class="calendar" id="calendar"></div>

<div id="details">
    <h3 id="dayTitle"></h3>
    <div class="btn-group">
        <button onclick="showPlan('A')">Plano A</button>
        <button onclick="showPlan('B')">Plano B</button>
        <button onclick="showPlan('C')">Plano C</button>
    </div>
    <div id="content" class="content-box"></div>
</div>

<script>
// O objeto tripData permanece o mesmo da versão anterior para garantir a funcionalidade completa.
const tripData = {
    "31/12": { A: "<strong>Chegada</strong><br>Traslado via <a href='https://www.keisei.co.jp/'>Skyliner</a>. <br>Custo: <span class='cost-tag'>¥ 14.280</span>", B: "...", C: "..." },
    // ... (restante dos dados preenchidos como no código anterior)
};

// Lógica de Renderização...
function createCalendar() {
    const calendar = document.getElementById('calendar');
    const days = ["31/12", "01/01", "02/01", "03/01", "04/01", "05/01", "06/01", "07/01", "08/01", "09/01", "10/01", "11/01", "12/01", "13/01", "14/01", "15/01", "16/01", "17/01", "18/01", "19/01", "20/01"];
    days.forEach(d => {
        const div = document.createElement('div');
        div.className = 'day';
        div.innerText = d;
        div.onclick = () => openDay(d);
        calendar.appendChild(div);
    });
}
function openDay(date) { 
    document.getElementById('details').style.display = 'block'; 
    document.getElementById('dayTitle').innerText = "Programação: " + date; 
    window.selectedDate = date; 
}
function showPlan(plan) {
    const data = tripData[window.selectedDate];
    document.getElementById('content').innerHTML = data ? data[plan] : "Em breve.";
}
createCalendar();
</script>
</body>
</html>
