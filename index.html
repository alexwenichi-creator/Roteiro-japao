function createCalendar() {
    const calendar = document.getElementById('calendar');
    Object.keys(tripData).forEach(date => {
        const day = document.createElement('div');
        day.className = 'day';
        day.innerText = date;
        day.onclick = () => openDay(date);
        calendar.appendChild(day);
    });
}

function openDay(date) {
    document.getElementById('details').style.display = 'block';
    document.getElementById('dayTitle').innerText = "Programação: " + date;
    document.getElementById('content').innerHTML = "Selecione um plano acima.";
    window.selectedDate = date;
}

function showPlan(plan) {
    const data = tripData[window.selectedDate][plan];
    document.getElementById('content').innerHTML = `<h4>${data.title}</h4><p>${data.desc}</p><p><b>Custo estimado: ${data.cost}</b></p>`;
}

createCalendar();
