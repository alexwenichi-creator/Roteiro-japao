            --border-color: #000000;
        }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        h2 { 
            text-align: center; 
            color: var(--accent-color); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 28px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .calendar { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 12px; 
            max-width: 950px; 
            margin: 0 auto 30px auto; 
        }
        .day { 
            padding: 18px 10px; 
            background: var(--box-bg); 
            border: 2px solid var(--border-color); 
            text-align: center; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px;
            transition: 0.2s; 
        }
        .day:hover { 
            background: var(--accent-color); 
            color: #FFFFFF; 
            border-color: var(--accent-color); 
        }
        #details { 
            max-width: 950px; 
            margin: 0 auto; 
            padding: 30px; 
            background: var(--box-bg); 
            border: 2px solid var(--border-color); 
            display: none; 
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button.plan-btn {
            min-width: 170px;
            min-height: 55px;
            padding: 14px 20px;
            cursor: pointer;
            border: 2px solid var(--border-color);
            background: #ffffff;
            color: var(--text-color);
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }
        button.plan-btn:hover {
            background: var(--accent-color);
            color: #FFFFFF;
            border-color: var(--accent-color);
            transform: translateY(-4px) scale(1.03);
        }
        button.log-btn {
            background: var(--log-color) !important;
            color: #FFFFFF !important;
            border-color: var(--log-color) !important;
        }
        button.log-btn:hover {
            background: #1a5ab9 !important;
        }
        button.tips-btn {
            background: #000000;
            color: #FFFFFF;
        }
        button.tips-btn:hover {
            background: var(--accent-color);
        }
        .content-box { 
            border-left: 5px solid var(--accent-color); 
            padding-left: 20px; 
            line-height: 1.8; 
            font-size: 14px;
        }
        a { 
            color: var(--accent-color); 
            text-decoration: none; 
            border-bottom: 1px dotted var(--accent-color); 
        }
        a:hover { 
            background: var(--accent-color); 
            color: #FFFFFF; 
        }
        .cost-tag { 
            color: var(--accent-color); 
            font-weight: bold; 
        }
        ol, ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>

function createCalendar() {
    const calendar = document.getElementById('calendar');
    Object.keys(tripData).forEach(date => {
        const day = document.createElement('div');
        day.className = 'day';
        day.innerText = date;
        day.onclick = () => openDay(date);
        calendar.appendChild(day);
    });
}

function openDay(date) {
    document.getElementById('details').style.display = 'block';
    document.getElementById('dayTitle').innerText = "Programação do dia: " + date + " de 2027";
    document.getElementById('content').innerHTML = "Selecione uma opção acima (Plano A, B, C, Como Chegar ou Dicas) para visualizar os detalhes.";
    window.selectedDate = date;
}

function showPlan(plan) {
    if (!window.selectedDate) return;
    const data = tripData[window.selectedDate];
    if (data && data[plan]) {
        document.getElementById('content').innerHTML = data[plan];
    } else {
        document.getElementById('content').innerHTML = "Informações indisponíveis.";
    }
}

createCalendar();
</script>
