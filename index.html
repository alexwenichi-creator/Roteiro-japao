            text-transform: uppercase;

            gap: 10px; 
            max-width: 1000px; 
            margin: 0 auto 30px auto; 
        }
        .weekday-header {
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            color: #555;
            padding: 6px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.05), -4px -4px 12px rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease; 
        }
        .day:hover { 
            background: var(--accent-color); 
            color: #FFFFFF; 
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(230,0,18,0.25);

        }

            background: transparent;
            border: none;
            box-shadow: none;
            cursor: default;
        }
        .day-date {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
        }
        .day-info {
            font-size: 10px;
            color: #555;
            line-height: 1.2;
            display: block;
        }

            margin: 0 auto; 
            padding: 25px; 
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-color); 
            display: none;

            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;

            color: var(--text-color);

</head>

function createCalendar() {
    const calendar = document.getElementById('calendar');
    calendar.innerHTML = '';
    
    const weekdays = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
    weekdays.forEach(wd => {
        const header = document.createElement('div');
        header.className = 'weekday-header';
        header.innerText = wd;
        calendar.appendChild(header);
    });

    // 31/12/2026 cai numa Quinta-feira (Índice 4: Dom=0, Seg=1, Ter=2, Qua=3, Qui=4)
    const offset = 4;
    for (let i = 0; i < offset; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        calendar.appendChild(empty);
    }

    Object.keys(tripData).forEach(date => {
        const dayInfo = tripData[date];
        const day = document.createElement('div');
        day.className = 'day';
        day.innerHTML = `
            <span class="day-date">${date}</span>
            <span class="day-info">${dayInfo.city}<br>${dayInfo.hotel}</span>
        `;
        day.onclick = () => openDay(date);
        calendar.appendChild(day);
    });
}

function openDay(date) {
    document.getElementById('details').style.display = 'block';
    document.getElementById('dayTitle').innerText = "Programação do dia: " + date + " de 2027";
    
    // AUDITORIA: Nenhum conteúdo é exibido automaticamente ao abrir o dia.
    const contentBox = document.getElementById('content');
    contentBox.innerHTML = "👈 Selecione uma das opções acima (Plano A, B, C, Como Chegar ou Dicas) para exibir as informações.";
    contentBox.className = "content-box";
    
    window.selectedDate = date;
    
    const data = tripData[date];
    document.getElementById('btnA').innerHTML = data.iconA || "Plano A";
    document.getElementById('btnB').innerHTML = data.iconB || "Plano B";
    document.getElementById('btnC').innerHTML = data.iconC || "Plano C";

    window.scrollTo({ top: document.getElementById('details').offsetTop - 20, behavior: 'smooth' });
}

function showPlan(plan) {
    if (!window.selectedDate) return;
    const data = tripData[window.selectedDate];
    const contentBox = document.getElementById('content');
    contentBox.className = "content-box active";
    
    if (data && data[plan]) {
        contentBox.innerHTML = data[plan];
    } else {
        contentBox.innerHTML = "Informações indisponíveis.";
    }
}

createCalendar();
</script>
